name: Deploy Target Node to Kaggle

on:
  push:
    branches:
      - main
    paths:
      - 'target_worker/**'
  workflow_dispatch: 

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Kaggle CLI
      run: |
        pip install --upgrade pip
        pip install kaggle

    - name: Inject Network Tunnel Credentials
      run: |
        sed -i 's|os.environ.get("NGROK_TOKEN")|"${{ secrets.NGROK_TOKEN }}"|g' target_worker/target_script.py
        sed -i 's|os.environ.get("NGROK_DOMAIN")|"${{ secrets.NGROK_DOMAIN }}"|g' target_worker/target_script.py

    - name: Debug Secret Lengths (Safe)
      env:
        K_USER: ${{ secrets.KAGGLE_USERNAME }}
        K_KEY: ${{ secrets.KAGGLE_KEY }}
      run: |
        echo "Username length: ${#K_USER}"
        echo "Key length: ${#K_KEY}"

    - name: Push Worker Node to Kaggle
      env:
        KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      run: |
        cd target_worker
        kaggle kernels push -p .