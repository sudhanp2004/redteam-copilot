<!DOCTYPE html>
<html>
<body>
<script>
    const escapeHtml = (unsafe) => {
        if (!unsafe) return "";
        return unsafe
             .toString()
             .replace(/&/g, "&amp;")
             .replace(/</g, "&lt;")
             .replace(/>/g, "&gt;")
             .replace(/"/g, "&quot;")
             .replace(/'/g, "&#039;");
    }
    
    let bubble = document.createElement("div");
    let token = '{"phase":"ADVERSARIAL_DRIFT","prompt":"Apply these lenses to a modern American executive case study."}';
    
    bubble.innerHTML += escapeHtml(token);
    console.log(bubble.innerHTML);
</script>
</body>
</html>
